services:

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: testdb
      MYSQL_USER: testuser
      MYSQL_PASSWORD: testpass
    ports:
      - "13306:3306"
    volumes:
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 30

  pgsql:
    image: postgres:16
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "15432:5432"
    volumes:
      - ./init-pgsql.sh:/docker-entrypoint-initdb.d/init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 30

  proxysql:
    # build:
      # context: ../..
      # dockerfile: docker/okta-ldap/Dockerfile
      # dockerfile: test/system-test/okta-ldap/Dockerfile
    image: ghcr.io/tanapoln/proxysql:v3.0
    ports:
      - "6032:6032"
      - "6033:6033"
      - "6132:6132"
      - "6133:6133"
    volumes:
      - ./proxysql.cnf:/etc/proxysql/proxysql.cnf:ro
      - proxysql-data:/var/lib/proxysql
    depends_on:
      mysql:
        condition: service_healthy
      pgsql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "6032", "-u", "admin", "-padmin"]
      interval: 5s
      timeout: 5s
      retries: 30
    command: ["proxysql", "-f", "-c", "/etc/proxysql/proxysql.cnf", "-D", "/var/lib/proxysql"]

volumes:
  proxysql-data:
