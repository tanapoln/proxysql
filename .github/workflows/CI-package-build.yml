name: CI-package-build
run-name: '${{ github.ref_name }} ${{ github.workflow }} ${{ github.sha }}'

on:
  push:
    branches: [ 'v[0-9]+.x','v[0-9]+.[0-9]+','v[0-9]+.[0-9]+.[0-9]+' ]
    paths-ignore:
    - '.github/**'
    - '**.md'
#  schedule:
#    - cron: '15 13 * * 3'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  run:
    uses: sysown/proxysql/.github/workflows/ci-package-build.yml@GH-Actions
    secrets: inherit
    with:
      trigger: ${{ toJson(github) }}

  publish:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Publish pre-release (remove draft flag)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        BRANCH="${{ github.ref_name }}"
        RELEASE_TAG="${BRANCH}-head"
        echo "Publishing release ${RELEASE_TAG} as pre-release..."
        gh release edit "${RELEASE_TAG}" \
          --repo "${{ github.repository }}" \
          --prerelease \
          --draft=false
